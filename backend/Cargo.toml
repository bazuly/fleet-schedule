[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
argon2 = "0.5"
axum = { version = "0.8.9", features = ["ws", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures = "0.3.34"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
